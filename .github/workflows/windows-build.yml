name: Windows/MinGW-W64 CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      # This is actions/checkout@v6.0.2
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 3
    - name: Set up MSYS2 MinGW-W64
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: false
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-autotools
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-libdeflate
          mingw-w64-x86_64-tools-git
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-bzip2
          mingw-w64-x86_64-xz
          mingw-w64-x86_64-ncurses
    - name: Clone htslib
      shell: msys2 {0}
      run: |
        export PATH="$PATH:/mingw64/bin:/c/Program Files/Git/bin"
        export MSYSTEM=MINGW64
        .ci_helpers/clone ${GITHUB_REPOSITORY_OWNER} htslib htslib ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} ${{ github.sha }}
        pushd .
        cd htslib
        autoreconf -i
        popd
    - name: Compile samtools
      shell: msys2 {0}
      run: |
        export PATH="$PATH:/mingw64/bin:/c/Program Files/Git/bin"
        export MSYSTEM=MINGW64
        autoheader
        autoconf -Wno-syntax
        ./configure --disable-ref-cache --enable-werror
        make -j4
    - name: Check samtools
      shell: msys2 {0}
      run: |
        export PATH="$PATH:/mingw64/bin:/c/Program Files/Git/bin"
        export MSYSTEM=MINGW64
        make check

